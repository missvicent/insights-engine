# CI stack: hermetic, no Supabase CLI dependency.
# Brings up Postgres + PostgREST + nginx gateway + the API; applies migrations via psql.
# Health smoke: curl /health and /health/db on localhost:8000.
#
# Architecture note: supabase-py always appends /rest/v1 to SUPABASE_URL (matching
# the real Supabase Kong gateway layout). The `gateway` nginx service proxies
# /rest/v1/* → PostgREST so the URL pattern works without a real Kong instance.

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 2s
      timeout: 3s
      retries: 20

  migrate:
    image: postgres:17-alpine
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: postgres
    volumes:
      - ./supabase/ci/bootstrap.sql:/sql/000_bootstrap.sql:ro
      - ./supabase/migrations:/sql/migrations:ro
      - ./supabase/seed.sql:/sql/zzz_seed.sql:ro
    entrypoint: ["/bin/sh", "-eu", "-c"]
    command:
      - |
        psql -v ON_ERROR_STOP=1 -f /sql/000_bootstrap.sql
        for f in $$(ls /sql/migrations/*.sql | sort); do
          echo "==> applying $$f"
          psql -v ON_ERROR_STOP=1 -f "$$f"
        done
        psql -v ON_ERROR_STOP=1 -f /sql/zzz_seed.sql

  postgrest:
    image: postgrest/postgrest:v13.0.5
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      PGRST_DB_URI: postgres://postgres:postgres@postgres:5432/postgres
      PGRST_DB_ANON_ROLE: anon
      PGRST_DB_SCHEMAS: public
      PGRST_JWT_SECRET: ci-smoke-not-verified-by-anonymous-requests
    # No healthcheck: the postgrest:v13 image is distroless (no shell, no
    # bash, no curl), so CMD/CMD-SHELL probes can't run. Downstream
    # readiness is verified end-to-end by the `api` service's healthcheck
    # (which proxies through `gateway` → postgrest → postgres).

  # Thin nginx gateway: proxies /rest/v1/* → PostgREST (port 3000).
  # Mirrors the Kong layout that supabase-py expects when it appends /rest/v1.
  gateway:
    image: nginx:1.29.8-alpine
    depends_on:
      postgrest:
        condition: service_started
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        cat > /etc/nginx/conf.d/default.conf << 'EOF'
        server {
          listen 8080;
          location /rest/v1/ {
            proxy_pass http://postgrest:3000/;
            proxy_pass_request_headers on;
          }
        }
        EOF
        nginx -g 'daemon off;'
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 8080"]
      interval: 2s
      timeout: 3s
      retries: 20

  api:
    build: .
    depends_on:
      gateway:
        condition: service_healthy
    env_file: .env.ci
    ports:
      - "8000:8000"
    healthcheck:
      test:
        - CMD-SHELL
        - 'python -c "import urllib.request,sys;sys.exit(0 if urllib.request.urlopen(''http://localhost:8000/health'').status==200 else 1)"'
      interval: 3s
      timeout: 3s
      retries: 20
